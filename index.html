<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günay xanım & Mehmet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffe6f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            text-align: center;
        }

        /* Falling Hearts & Flowers Animation */
        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Card Container */
        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid #ffb6c1;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .image-container {
            margin: 15px 0;
            display: none;
        }

        .image-container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid #ff69b4;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-yes {
            background-color: #28a745;
            color: white;
        }

        .btn-yes:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #dc3545;
            color: white;
        }

        .btn-no:hover {
            background-color: #c82333;
            transform: scale(1.05);
        }

        /* Final Celebration Style */
        .result-text {
            color: #ff1493;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>

            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 2 + 's';
            item.style.fontSize = Math.random() * 15 + 18 + 'px';
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 5000);
        }

        setInterval(createFallingItem, 250);

        // 'Yox' düyməsi basıldıqda dəyişən mətnlər dancəsi
        let noCount = 0;
        const messages = [
            "gunay xanim ewwey mehmeti affedermi",
            "yoxe yo bagislamalisan",
            "Ae allahaqqi bagiwlamalisan"
        ];

        function handleNo() {
            noCount++;
            const imgBox = document.getElementById('imgBox');
            const questionText = document.getElementById('questionText');

            // Şəkli göstəririk
            imgBox.style.display = 'block';

            if (noCount === 1) {
                questionText.innerText = messages[1];
            } else {
                questionText.innerText = messages[2];
            }
        }

        function handleYes() {
            const questionText = document.getElementById('questionText');
            const imgBox = document.getElementById('imgBox');
            const btnGroup = document.getElementById('btnGroup');
            const finalMessage = document.getElementById('finalMessage');
            const audio = document.getElementById('loveSong');

            // Musiqini oxudur
            audio.play().catch(e => console.log('Audio error:', e));

            // Elementləri yeniləyirik
            imgBox.style.display = 'none';
            btnGroup.style.display = 'none';
            questionText.innerText = "🎉 BARIŞDIQ! 🎉";
            finalMessage.style.display = 'block';
            finalMessage.innerText = "afrikadaki ac usaglari dusunduk ve bariwdig";

            // Yağış effektivliyini artırırıq
            setInterval(createFallingItem, 60);
        }
    </script>
</body>
</html>
