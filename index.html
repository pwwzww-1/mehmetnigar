<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günay xanım & Mehmet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffeef2;
            color: #d81b60;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px 20px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.92);
            box-shadow: 0 10px 25px rgba(216, 27, 96, 0.15);
            z-index: 10;
            position: relative;
        }

        h1 {
            color: #ff4081;
            font-size: 26px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        h2 {
            color: #c2185b;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 30px;
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-he {
            background-color: #ff4081;
            color: white;
        }

        .btn-he:hover {
            background-color: #e91e63;
            transform: scale(1.05);
        }

        .btn-yox {
            background-color: #78909c;
            color: white;
        }

        .btn-yox:hover {
            background-color: #607d8b;
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        #yoxDiv img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Floating background elements */
        .falling-item {
            position: fixed;
            top: -50px;
            z-index: 1;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        #bariwdiDiv h1 {
            font-size: 32px;
            color: #e91e63;
        }

        #bariwdiDiv p {
            font-size: 20px;
            color: #ad1457;
            font-weight: 600;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Background Audio -->
    <audio id="bgMusic" src="music.mp3" loop></audio>

    <!-- Step 1: Initial Question -->
    <div id="mainDiv" class="container">
        <h1>gunay xanim ewwey mehmeti affedermi</h1>
        <div class="btn-group">
            <button class="btn btn-he" onclick="affetHe()">Hə</button>
            <button class="btn btn-yox" onclick="affetYox()">Yox</button>
        </div>
    </div>

        <h2 id="yoxMetn">Yoxe yo bagislamalisan</h2>
        <div class="btn-group">
            <button class="btn btn-he" onclick="affetHe()">Hə</button>
            <button class="btn btn-yox" onclick="yoxDovr()">Yox</button>
        </div>
    </div>

    <!-- Step 3: Success -->
    <div id="bariwdiDiv" class="container hidden">
        <h1>❤️ Barışdıq! ❤️</h1>
        <p>afrikadaki ac usaglari dusunduk ve bariwdig</p>
    </div>

    <script>
        // Array of texts for infinite loop on "Yox" click
        const yoxMetnleri = [
            "Yoxe yo bagislamalisan",
            "Ae allahaqqi bagiwlamalisan",
            "Bax bele eleme, bagisla daa...",
            "Bir daha dusun, he de!",
            "Ewweklik eledi amma pesmandir!",
            "Ewwek Mehmet sene qurban olsun, bagisla!",
            "Hele de yox deyirsen? VALLAHI bagiwlamalisan!",
            "Butun dunya gozleyir, HE de!",
            "Bax son sansin, bagislayacaqsan! 🌹"
        ];
        
        let index = 1;

        // Background floating animation (hearts & flowers)
        const symbols = ["🌸", "🌹", "💖", "🌷", "💕", "✨", "❤️"];
        
        function createFallingItem() {
            const item = document.createElement("div");
            item.className = "falling-item";
            item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            item.style.left = Math.random() * 100 + "vw";
            item.style.fontSize = (Math.random() * 20 + 20) + "px";
            item.style.animationDuration = (Math.random() * 3 + 3) + "s";
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6000);
        }

        // Continuous light background falling hearts/flowers
        setInterval(createFallingItem, 400);

        function affetHe() {
            // Play background music
            const music = document.getElementById("bgMusic");
            music.play().catch(e => console.log("Audio play error:", e));

            // Hide questions and show result
            document.getElementById("mainDiv").classList.add("hidden");
            document.getElementById("yoxDiv").classList.add("hidden");
            document.getElementById("bariwdiDiv").classList.remove("hidden");

            // Increase rain density
            setInterval(createFallingItem, 80);
        }

        function affetYox() {
            document.getElementById("mainDiv").classList.add("hidden");
            document.getElementById("yoxDiv").classList.remove("hidden");
            document.getElementById("yoxMetn").innerText = yoxMetnleri[0];
            index = 1;
        }

        function yoxDovr() {
            const yoxMetnDiv = document.getElementById("yoxMetn");
            yoxMetnDiv.innerText = yoxMetnleri[index];
            index = (index + 1) % yoxMetnleri.length; // Endless loop
        }
    </script>
