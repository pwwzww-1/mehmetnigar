<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xüsusi Sürpriz ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 1s ease;
        }

        /* Arxa plan şəkli və kölgələnmə */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Şəklin ünvanı */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) blur(3px);
            z-index: -1;
            transition: all 1s ease;
        }

        /* Əsas kart */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            z-index: 10;
            transition: transform 0.3s ease, background 1s ease, border 1s ease;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            transition: color 1s ease;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff4b2b, #ff416c);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
            z-index: 2;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            position: absolute;
            transition: all 0.15s ease-out;
            z-index: 100;
        }

        /* Hə-yə basıldıqdan sonra Çəhrayı Tema */
        body.pink-theme .bg-overlay {
            opacity: 0;
        }

        body.pink-theme {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
        }

        body.pink-theme .card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.3);
        }

        body.pink-theme h1 {
            color: #d63384;
            text-shadow: none;
        }

        /* Yuxarıdan yağan elementlər (Güllər və Ürəklər) */
        .falling-element {
            position: fixed;
            top: -10vh;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            z-index: 1000;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="card" id="mainCard">
        <h1 id="questionText">Mənimlə bir ömür qalmağa HƏ deyərsən? ❤️</h1>
        <div class="buttons" id="btnContainer">
            <button class="btn btn-yes" onclick="selectYes()">HƏ</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">YOX</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        // Yox düyməsini sonsuz olaraq təsadüfi yerə qaçıran funksiya
        function moveNoButton() {
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // HƏ düyməsinə basıldıqda işə düşən funksiya
        function selectYes() {
            // Çəhrayı temaya keçid
            document.body.classList.add('pink-theme');

            // Mətni dəyişdir
            document.getElementById('questionText').innerHTML = "Səni çox sevirəm! 💖🌹<br>Ən gözəl günlərimiz birlikdə olsun!";
            
            // Düymələri gizlət
            document.getElementById('btnContainer').style.display = 'none';

            // Yağış effektini başladır
            startRomanticRain();
        }

        // Güllər və ürəklərin yağma effekti
        function startRomanticRain() {
            const items = ['🌹', '💖', '❤️', '🌸', '✨', '💕'];
            
            setInterval(() => {
                const element = document.createElement('div');
                element.classList.add('falling-element');
                element.innerText = items[Math.floor(Math.random() * items.length)];
                
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDuration = Math.random() * 2 + 3 + 's';
                element.style.fontSize = Math.random() * 20 + 20 + 'px';
                
                document.body.appendChild(element);

                setTimeout(() => {
                    element.remove();
                }, 5000);
            }, 150);
        }
    </script>
</body>
</html>
